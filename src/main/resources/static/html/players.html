<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Base Metrics - Players</title>
    <link rel="stylesheet" href="../styles.css" />
    <script type = "text/javascript" src="../script.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function()
        {
            fetchPlayerStats();

            const hittingBtn = document.getElementById("toggle-hitting");
            const pitchingBtn = document.getElementById("toggle-pitching");

            const filterPos = document.getElementById("players-options");
            const filterPosTitle = document.getElementById("filter-pos");

            function handleToggle(clickedBtn) {
                hittingBtn.classList.remove("active");
                pitchingBtn.classList.remove("active");

                clickedBtn.classList.add("active");

                if (clickedBtn === pitchingBtn) {
                    filterPos.style.display = "none";
                    filterPosTitle.style.display = "none";
                } else {
                    filterPos.style.display = "block";
                    filterPosTitle.style.display = "block";
                }
                fetchPlayerStats(0);
            }

            hittingBtn.addEventListener("click", () => handleToggle(hittingBtn));
            pitchingBtn.addEventListener("click", () => handleToggle(pitchingBtn));

            document.getElementById("searchForm").addEventListener("submit", function(e) {
                e.preventDefault();
                fetchPlayerStats(0);
            });


            document.getElementById("players-options").addEventListener("change", (event) => {
                fetchPlayerStats(0);
            });

        }, false);
    </script>
</head>
<body>
<main>

    <div class="navbar">
        <a class="home-nav-page" href="index.html">Base Metrics</a>

        <div class="multi-nav-page">
            <a class="games-nav-page" href="games.html">Games</a>
            <a class="standings-nav-page" href="standings.html">Standings</a>
            <a class="players-nav-page" href="players.html">Players</a>
            <a class="teams-nav-page" href="teams.html">Teams</a>
        </div>

        <a class="contact-nav-page" href="contact.html">Contact Us</a>

    </div>

    <div class="players">

        <div class="players-header">

            <h1 id="players-title">
                Player Statistics
            </h1>

            <div id="toggle-buttons">
                <button id="toggle-hitting" class="toggle-btn active">Hitting</button>
                <button id="toggle-pitching" class="toggle-btn">Pitching</button>
            </div>

            <form id="searchForm">

                <div>
                    <h1 id="filter-name">Filter by Name</h1>
                    <input type="text" id="searchInput" placeholder="name" autocomplete="off" autocapitalize="off">
                </div>
                <label for="players-options"></label>
                <div>
                    <h1 id="filter-pos">Filter by Position</h1>
                    <select name="players-options" id ="players-options">
                        <option value="all">All Positions</option>
                        <option value="1B">1st Base</option>
                        <option value="2B">2nd Base</option>
                        <option value="3B">3rd Base</option>
                        <option value="SS">Short Stop</option>
                        <option value="LF">Left Field</option>
                        <option value="CF">Center Field</option>
                        <option value="RF">Right Field</option>
                        <option value="OF">Outfield</option>
                        <option value="C">Catcher</option>
                        <option value="DH">Designated Hitter</option>
                    </select>
                </div>
            </form>

        </div>

        <div class="players-all-tables"></div>

    </div>



</main>
</body>
</html>
