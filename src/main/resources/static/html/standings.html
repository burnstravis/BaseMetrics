<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Base Metrics - Standings</title>
    <link rel="stylesheet" href="../styles.css" />
    <script type = "text/javascript" src="../script.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function()
        {
            fetchStandingsData("division");

            const selectElement = document.getElementById('standings-options');

            selectElement.addEventListener('change', (event) => {
                const selectedSort = event.target.value;

                fetchStandingsData(selectedSort);
            });


        }, false);

    </script>
</head>
<body>
<main>

    <div class="navbar">
        <a class="home-nav-page" href="index.html">Base Metrics</a>

        <div class="multi-nav-page">
            <a class="games-nav-page" href="games.html">Games</a>
            <a class="standings-nav-page" href="standings.html">Standings</a>
            <a class="players-nav-page" href="players.html">Players</a>
            <a class="teams-nav-page" href="teams.html">Teams</a>
        </div>

        <a class="contact-nav-page" href="contact.html">Contact Us</a>

    </div>

    <div class="standings">

        <h1 id="standings-title">
            Standings
        </h1>

        <label for="standings-options"></label>
        <select name="standings-options" id ="standings-options">
            <option value="division">Division</option>
            <option value="league">League</option>
            <option value="all">MLB</option>
        </select>

        <div class="standings-all-tables"></div>

    </div>

</main>
</body>
</html>
